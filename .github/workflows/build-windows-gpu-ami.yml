name: Build Windows GPU AMI
on:
  workflow_dispatch:
    inputs:
      keep_old_amis:
        description: Keep superseded AMIs after this bake
        type: boolean
        default: false
  schedule:
    # Mondays; the 25-day age guard yields exact 28-day bake cycles.
    - cron: "0 3 * * 1"

permissions:
  id-token: write   # OIDC -> AWS
  contents: read
  issues: write     # bake-failure alert

jobs:
  build-ami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_AMI_BUILDER_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      # Age guard for scheduled firings; manual dispatches always bake.
      - name: Decide whether to bake
        id: age
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "bake=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          newest=$(aws ec2 describe-images --owners self \
            --filters "Name=name,Values=cubie-win-gpu-*" \
            --query 'sort_by(Images,&CreationDate)[-1].CreationDate' \
            --output text)
          if [ "$newest" = "None" ]; then
            echo "No existing AMI; baking."
            echo "bake=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age_days=$(( ($(date +%s) - $(date -d "$newest" +%s)) / 86400 ))
          echo "Newest AMI is ${age_days} days old."
          if [ "$age_days" -ge 25 ]; then
            echo "bake=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping this firing."
            echo "bake=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Packer
        if: steps.age.outputs.bake == 'true'
        uses: hashicorp/setup-packer@v3

      - name: Packer init
        if: steps.age.outputs.bake == 'true'
        run: packer init packer/windows-gpu.pkr.hcl

      # Chase brief per-AZ spot windows; only capacity misses retry.
      - name: Build AMI
        if: steps.age.outputs.bake == 'true'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          # Set to pin one subnet (e.g. no default VPC).
          PINNED_SUBNET: ${{ vars.AWS_BUILD_SUBNET_ID }}
          MAX_ROUNDS: "40"
          RETRY_INTERVAL: "20"   # seconds between rounds; short and frequent
        run: |
          set -euo pipefail
          if [ -n "${PINNED_SUBNET:-}" ]; then
            SUBNETS="$PINNED_SUBNET"
          else
            VPC=$(aws ec2 describe-vpcs --region "$AWS_REGION" \
              --filters Name=isDefault,Values=true \
              --query 'Vpcs[0].VpcId' --output text)
            SUBNETS=$(aws ec2 describe-subnets --region "$AWS_REGION" \
              --filters "Name=vpc-id,Values=$VPC" \
                        "Name=default-for-az,Values=true" \
              --query 'Subnets[].SubnetId' --output text)
          fi
          if [ -z "${SUBNETS// /}" ]; then
            echo "No candidate subnets found; set AWS_BUILD_SUBNET_ID." >&2
            exit 1
          fi
          # "Error waiting for fleet request" is printed only when the fleet
          # yields no instance (step_run_spot_instance.go); every AWS
          # capacity phrasing is wrapped by it, so match the wrapper.
          FLEET_MISS_RE='Error waiting for fleet request|InsufficientInstanceCapacity|no Spot capacity available|capacity-not-available|insufficient .*capacity'
          winrm_misses=0
          echo "Candidate subnets (one per AZ): $SUBNETS"
          for round in $(seq 1 "$MAX_ROUNDS"); do
            echo "===== spot-acquisition round $round/$MAX_ROUNDS ====="
            for SN in $SUBNETS; do
              echo "::group::packer build on subnet $SN (round $round)"
              set +e
              packer build \
                -var "region=$AWS_REGION" \
                -var "subnet_id=$SN" \
                packer/windows-gpu.pkr.hcl 2>&1 | tee packer.out
              rc=${PIPESTATUS[0]}
              set -e
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then
                echo "Bake succeeded in subnet $SN."
                exit 0
              fi
              if grep -q "MaxSpotInstanceCountExceeded" packer.out; then
                echo "Subnet $SN: regional spot quota exhausted (rc=$rc);" \
                     "all AZs share it -- skipping to the next round." >&2
                break
              fi
              if grep -Eq "$FLEET_MISS_RE" packer.out; then
                echo "Subnet $SN: no spot capacity now (rc=$rc);" \
                     "trying the next AZ."
                continue
              fi
              # A healthy boot can still miss WinRM; two fresh tries.
              if grep -q "Timeout waiting for WinRM" packer.out \
                  && [ "$winrm_misses" -lt 2 ]; then
                winrm_misses=$((winrm_misses + 1))
                echo "Subnet $SN: WinRM never came up" \
                     "(miss ${winrm_misses}/2); trying a fresh instance."
                continue
              fi
              echo "Subnet $SN: Packer failed after launch / for a" \
                   "non-capacity reason (rc=$rc); not retrying." >&2
              exit "$rc"
            done
            if [ "$round" -lt "$MAX_ROUNDS" ]; then
              echo "Round $round: no AZ had spot GPU capacity;" \
                   "retrying in ${RETRY_INTERVAL}s..."
              sleep "$RETRY_INTERVAL"
            fi
          done
          echo "No spot GPU capacity after $MAX_ROUNDS rounds." >&2
          exit 1

      # Surface PREP-MARKER lines; warn when the agent refresh skipped.
      - name: Report image prep results
        if: steps.age.outputs.bake == 'true'
        run: |
          set -euo pipefail
          {
            echo '## Image prep'
            grep -o 'PREP-MARKER.*' packer.out \
              || echo 'no PREP-MARKER lines in packer output'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -Eq 'PREP-MARKER runner-agent: (updated|current)' \
              packer.out; then
            echo "::warning::Runner agent not refreshed; AMI dispatch" \
              "lifetime tracks the base image's agent."
          fi

      - name: Deregister superseded cubie-win-gpu AMIs
        # Keep the most recent AMI; deregister older ones (and their
        # snapshots) so snapshot storage cost does not grow unbounded.
        if: steps.age.outputs.bake == 'true' && inputs.keep_old_amis != true
        run: |
          set -euo pipefail
          KEEP=$(aws ec2 describe-images --owners self \
            --filters "Name=name,Values=cubie-win-gpu-*" \
            --query 'sort_by(Images,&CreationDate)[-1].ImageId' --output text)
          echo "Keeping newest AMI: $KEEP"
          for AMI in $(aws ec2 describe-images --owners self \
            --filters "Name=name,Values=cubie-win-gpu-*" \
            --query 'Images[].ImageId' --output text); do
            if [ "$AMI" != "$KEEP" ]; then
              echo "Deregistering $AMI"
              SNAPS=$(aws ec2 describe-images --image-ids "$AMI" \
                --query 'Images[].BlockDeviceMappings[].Ebs.SnapshotId' --output text)
              aws ec2 deregister-image --image-id "$AMI"
              for SNAP in $SNAPS; do
                aws ec2 delete-snapshot --snapshot-id "$SNAP" || true
              done
            fi
          done

      # Dead bakes age the fleet toward GitHub's runner-dispatch cutoff.
      - name: Open an issue on bake failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Windows GPU AMI bake failed"
          body="Failed run: ${RUN_URL}. Runners stop receiving jobs once the baked agent falls 30 days behind the latest actions/runner release, so fix and re-dispatch the bake promptly."
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --search "in:title \"$title\"" \
            --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body "$body"
          else
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "$body"
          fi
