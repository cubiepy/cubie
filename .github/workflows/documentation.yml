name: Docs

# Each build deploys to its own folder of gh-pages: main for pushes to
# main, vX.Y.Z for releases, and pr-N for pull-request previews. The site
# root redirects to the latest release; see ci/tools/docs_site.py.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, closed ]
  # The release workflow calls this with the new tag, because releases
  # made with GITHUB_TOKEN do not trigger other workflows.
  workflow_call:
    inputs:
      ref:
        description: Release tag to build, such as v0.18.0.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to build, such as v0.18.0. Leave empty to build main.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

env:
  SITE_BASE: /cubie/

jobs:
  build:
    if: github.event.action != 'closed'
    env:
      NUMBA_ENABLE_CUDASIM: "1"        # GPU-less runner
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Choose the version folder
        id: version
        env:
          REF: ${{ inputs.ref }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$REF" ]; then
            if ! [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ref must be a release tag such as v0.18.0, got '$REF'" >&2
              exit 1
            fi
            version="$REF"
          elif [ "$EVENT" = "pull_request" ]; then
            version="pr-$PR_NUMBER"
          else
            version="main"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Build the requested ref, but take the site tools from the commit
      # running this workflow, so release builds get the current picker.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: src
      - uses: actions/checkout@v7
        with:
          path: tools
          sparse-checkout: ci/tools
      - uses: actions/setup-python@v6

      - name: Install dependencies
        working-directory: src
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install uv
          uv pip install sphinx sphinx_rtd_theme myst_parser .[dev-cuda13]

      - name: Sphinx build
        working-directory: src
        run: |
          source .venv/bin/activate
          sphinx-build ./docs/source ./docs/build

      - name: Add the version picker and verification tag
        run: >
          python tools/ci/tools/docs_site.py inject src/docs/build
          "${{ steps.version.outputs.version }}" "$SITE_BASE"

      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: src/docs/build/

  deploy:
    needs: build
    # Fork pull requests get a read-only token, so they build without
    # deploying a preview.
    if: >
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
          sparse-checkout: ci/tools
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
      - uses: actions/setup-python@v6
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: build

      - name: Publish the version folder
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bash ../tools/ci/tools/docs_publish.sh deploy "$VERSION" ../build

  remove-preview:
    if: >
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
          sparse-checkout: ci/tools
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
      - uses: actions/setup-python@v6

      - name: Remove the preview folder
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: pr-${{ github.event.pull_request.number }}
        run: bash ../tools/ci/tools/docs_publish.sh remove "$VERSION"
